name: Build Release (Both Flavors)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK and NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "ndk;28.2.13676358" || true
      - run: chmod +x gradlew
      - name: Prepare keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/app/release.keystore"
          printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/app/release.keystore" > app/keystore.properties
          printf 'storePassword=%s\n' "$KS_PASS" >> app/keystore.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> app/keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASS" >> app/keystore.properties
      - name: Build both flavors
        run: ./gradlew assembleFlossRelease assembleFullRelease --dependency-verification=lenient
      - name: Read version
        id: ver
        run: |
          VN=$(grep -m1 "versionName" app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VN" >> "$GITHUB_OUTPUT"
      - name: List APKs
        run: find app/build/outputs -name '*.apk'
      - uses: actions/upload-artifact@v5
        with:
          name: AppManagerNG-release-both
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mapfile -t apks < <(find app/build/outputs/apk -name '*.apk')
          TAG="v${{ steps.ver.outputs.name }}-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" "${apks[@]}" \
            --title "AppManagerNG ${{ steps.ver.outputs.name }} (floss + full)" \
            --notes "Сборка подписана личным ключом. Включает варианты floss и full."